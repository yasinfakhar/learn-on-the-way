# Include inside your HTTPS server block for learn.sayahub.ir.
# Proxy the whole host: OAuth discovery and browser routes are required too.
location / {
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 64k;
}
# Cloudflare: use Full (strict) TLS and bypass caching on this hostname.
# The app intentionally ignores forwarded client IP headers; tune Nginx rate
# limits if you need per-client throttling beyond the app's shared proxy limit.
